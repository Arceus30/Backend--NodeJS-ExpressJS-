<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Form</title>
    </head>
    <body
        style="
            min-height: 100vh;
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            display: flex;
            gap: 2rem;
        "
    >
        <form
            action="/review"
            style="
                display: flex;
                gap: 2rem;
                justify-content: center;
                align-items: center;
            "
            method="POST"
        >
            <textarea name="text" cols="40" rows="20"></textarea>
            <input type="submit" value="Submit Text" />
        </form>
    </body>
</html>
